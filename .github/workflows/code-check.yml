# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # - name: Set up Python 3.10
    #   uses: actions/setup-python@v3
    #   with:
    #     python-version: "3.10"

    # - name: Install dependencies
    #   run: |
    #     python -m pip install --upgrade pip
    #     pip install flake8 pytest
    #     if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    #     pip install .

    - name: Select Python environment
      shell: bash
      run: |
        set -euo pipefail

        venv_candidates=(
          "${FLAG_ATTENTION_CI_VENV:-}"
          "$HOME/.virtualenvs/release"
          "/home/flagattn_ci/.virtualenvs/release"
        )

        for venv in "${venv_candidates[@]}"; do
          if [ -n "$venv" ] && [ -f "$venv/bin/activate" ]; then
            echo "Using virtualenv: $venv"
            source "$venv/bin/activate"
            echo "PATH=$PATH" >> "$GITHUB_ENV"
            echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
            break
          fi
        done

        python --version
        python -m pip --version

    - name: Editable Install
      run: |
        python -m pip install --no-dependencies -e .

    # - name: Lint with flake8
    #   run: |
    #     # stop the build if there are Python syntax errors or undefined names
    #     flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    #     # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
    #     flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pytest tests
